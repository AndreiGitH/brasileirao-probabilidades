# Atualiza dados, odds, simulação e painel; publica o painel no GitHub Pages.
# Roda todo dia às 23:50 (Brasília) e quando o dono clica em "Run workflow".
# Só quem tem permissão de escrita no repositório consegue disparar manualmente.
name: Atualizar painel

on:
  schedule:
    - cron: "50 2 * * *"   # 02:50 UTC = 23:50 em Brasília (sem horário de verão)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: America/Sao_Paulo   # datas do projeto no horário de Brasília
      FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Instalar dependências
        run: uv sync --frozen

      - name: Atualizar, coletar odds, simular e gerar painel
        run: uv run brasileirao rodada --temporada 2026

      - name: Salvar resultados no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed painel
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -m "Atualização automática $(date +%Y-%m-%d)"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: painel

  publicar:
    needs: atualizar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
