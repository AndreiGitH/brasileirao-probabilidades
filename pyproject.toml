[project]
name = "brasileirao-probabilidades"
version = "0.1.0"
description = "Probabilidades do Brasileirão Série A: Dixon-Coles, odds de mercado e Monte Carlo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "requests>=2.31",
]

[project.scripts]
brasileirao = "brasileirao.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brasileirao"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
